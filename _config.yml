title: Deep Dives with Iman
description: Exploring the science, tech and societal impact of artificial intelligence with accessible expert insights.
tagline: Conversations on humans and machines.
baseurl: "" # Root of your site
url: "https://deepdivepod.eu"

theme: minima
plugins:
  - jekyll-feed

collections:
  episodes:
    output: true
    permalink: /episodes/:name/

exclude:
  - .bundle/
  - .DS_Store
  - .gitignore
  - README.md
  - PUBLISHING.md
  - add_episodes.py
  - build_episode.py
  - episodes_to_add.md
  - Gemfile
  - Gemfile.lock
  - ivet/
  - node_modules/
  - template.html
  - test.html
  - vendor/
