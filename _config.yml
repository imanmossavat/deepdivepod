title: Deep Dives with Iman
description: Exploring the science, tech and societal impact of artificial intelligence with accessible expert insights.
tagline: Conversations on humans and machines.
podcast_rss: https://anchor.fm/s/fd3d4430/podcast/rss # Season 2 onward (Spotify for Creators)
baseurl: "" # Root of your site
url: "https://deepdivepod.eu"

theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  posts_limit: 100
  collections:
    episodes:
      path: "/feed/episodes.xml"

collections:
  episodes:
    output: true
    permalink: /episodes/:name/

exclude:
  - .bundle/
  - .DS_Store
  - .gitignore
  - README.md
  - PUBLISHING.md
  - add_episodes.py
  - build_episode.py
  - episodes_to_add.md
  - Gemfile
  - Gemfile.lock
  - ivet/
  - node_modules/
  - template.html
  - test.html
  - vendor/

defaults:
  - scope:
      path: "admin"
    values:
      sitemap: false
